org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\=-Xmx2048M
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Works around https://youtrack.jetbrains.com/issue/KT-72068 (Kotlin 2.1.0): the Kotlin/Native
# toolchain distribution needed for klib cross-compilation (e.g. the kspKotlinIosSimulatorArm64
# task) isn't fully downloaded before compile tasks try to use it, so they fail with
# "Can't find env_blacklist file" followed by a ClassNotFoundException for
# org.jetbrains.kotlin.cli.utilities.MainKt. Disabling the auto-provisioned toolchain avoids
# that broken download path.
kotlin.native.toolchain.enabled=false

# linkDebugFrameworkIosSimulatorArm64 crashes with a NullPointerException inside the Kotlin/Native
# compiler's dependency-cache bookkeeping (CachedLibraries/CacheSupport/KonanConfig, a known class
# of K/N compiler-cache bug). Disabling the per-target binary cache avoids that code path.
kotlin.native.cacheKind.iosX64=none
kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind.iosSimulatorArm64=none

android.useAndroidX=true
android.nonTransitiveRClass=true
