org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\=-Xmx2048M
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9's new DSL and built-in Kotlin support both forbid mixing the Kotlin Multiplatform
# plugin with com.android.application in the same module. Opt out of both (temporary;
# removed in AGP 10) to keep composeApp as a single KMP + Android application module.
android.newDsl=false
android.builtInKotlin=false
