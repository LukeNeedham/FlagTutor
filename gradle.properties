org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\=-Xmx2048M
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Works around the Kotlin/Native compiler daemon failing with
# "ClassNotFoundException: org.jetbrains.kotlin.cli.utilities.MainKt" when invoked from inside
# an Xcode Run Script build phase (its heavily-customized environment breaks the daemon's own
# JVM subprocess launch). Forces in-process compilation instead.
kotlin.native.disableCompilerDaemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
