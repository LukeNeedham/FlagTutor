name: On Pull Request Closed

on:
    pull_request:
        types: [closed]
        branches:
            - main

permissions:
  contents: write       # write to allow deleting Releases and tags

jobs:
    # Deletes the PR's build pre-releases once it merges.
    # Shared across projects: https://github.com/LukeNeedham/ci-workflows
    cleanup:
        uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_cleanup.yml@main
