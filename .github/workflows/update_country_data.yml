name: Update Country Data

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Only download images for these comma separated alpha-2 codes, e.g. af,sy (blank refreshes every country)"
        type: string
        default: ""
  schedule:
    # Monthly, so flag changes are picked up without anyone having to remember.
    - cron: "17 4 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-country-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "gradle"

      - name: Build country data from Wikipedia
        timeout-minutes: 60
        env:
          FLAG_CODES: ${{ inputs.codes }}
        run: |
          ./gradlew generateCountryData -PflagCodes="$FLAG_CODES" --console=plain | tee country_data.log
          echo "## Country data results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "ISO 3166|Wrote|Images|Countries with|Missing|Hint|Problem" country_data.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # A pull request rather than a direct push: a changed flag needs its symbolism text rewritten, and
      # the lead image of an article is occasionally not the flag, so a person should look first.
      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            composeApp/src/commonMain/composeResources/files/country_data.json
            composeApp/src/commonMain/composeResources/files/flags
          branch: automation/update-country-data
          commit-message: "Update country data from Wikipedia"
          title: "Update country data from Wikipedia"
          body: |
            Rebuilt by `./gradlew generateCountryData`.

            Please check any changed flag images, and rewrite the `symbolism` text for a flag whose design changed.
            The Commons file behind each flag is listed in `flagImageSource`.
          delete-branch: true
