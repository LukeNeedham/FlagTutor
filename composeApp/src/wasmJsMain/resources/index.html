<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlagTutor</title>
    <!-- Resolved once, against the URL the page was loaded with (the app's base, e.g. "<base>/?/debug/x").
         The URL is then rewritten to the real route, which must not change where "composeApp.js" and
         the compose resources are fetched from. -->
    <base href="./">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
    <script>
        // GitHub Pages can't serve /play or /credits directly, so 404.html bounces those URLs to
        // "<base>/?/<route>". Restore the real URL before the app starts so it can route on it.
        (function (l) {
            if (l.search[1] === '/') {
                var route = l.search.slice(2).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
                window.history.replaceState(null, '', l.pathname.replace(/index\.html$/, '') + route + l.hash);
            }
        }(window.location));
    </script>
    <script src="config.js"></script>
    <script src="composeApp.js"></script>
</head>
<body>
</body>
</html>
